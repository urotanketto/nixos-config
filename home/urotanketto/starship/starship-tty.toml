format = "$username$hostname$directory$git_branch$git_status$character"

[username]
show_always = true
format = "[$user]($style)"

[hostname]
ssh_only = false
format = "@[$hostname]($style) "

[directory]
format = "[$path]($style) "

[git_branch]
symbol = "git:"
format = "[$symbol$branch]($style) "

[git_status]
format = "[$all_status$ahead_behind]($style) "

[character]
success_symbol = "> "
error_symbol = "! "

